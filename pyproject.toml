[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftoolbox"
version = "0.1.0"
description = "Cross-platform PDF toolbox: merge (PDF/Word/images), split, rotate, page numbers, watermark, blank-page removal. PDF 工具箱：合并/拆分/旋转/页码/水印/删空白页。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["pdf", "merge", "split", "rotate", "watermark", "page-number", "word", "工具箱"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1"]
# Windows users with MS Word installed can convert .docx through Word itself:
word = ["docx2pdf>=0.1.8"]

[project.scripts]
pdftoolbox = "pdftoolbox.cli:main"
pdftoolbox-gui = "pdftoolbox.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "wordconv: tests that need a real Word converter (LibreOffice / MS Word)",
]
